name: SogukRadar posta gonder

# Postayi EDITOR ONAYI tetikler. Haftalik kosu (weekly.yml) yalnizca veri
# uretir; bu is akisi out/ONAY dosyasi push edildiginde calisir ve o anki
# out/email.html'i gonderir.
#
# ONAY dosyasinin ILK SATIRI donem olmalidir (ornek: 2026-W34). Asagidaki
# kontrol, ONAY'in guncel kosuya ait oldugunu dogrular - eski bir ONAY
# dosyasi kazara yeniden push edilirse posta gitmez.

on:
  push:
    branches: [main]
    paths:
      - "out/ONAY"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sogukradar-posta
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    env:
      MAIL_USER: ${{ secrets.MAIL_USER }}
    steps:
      - uses: actions/checkout@v4

      # CIFT POSTA KORUMASI (2026-11-02): otomatik hat (otomatik.yml) bu
      # donemi zaten gonderdiyse editor ONAY'i ikinci posta yollamaz.
      - name: Donem zaten gonderildi mi
        id: guard
        run: |
          ONAY_DONEM=$(head -1 out/ONAY 2>/dev/null | tr -d '[:space:]')
          python - "$ONAY_DONEM" <<'PY' >> $GITHUB_OUTPUT
          import json, sys
          st = json.load(open("state/state.json", encoding="utf-8"))
          zaten = sys.argv[1] in (st.get("gonderilen_donemler") or [])
          print("atla=%s" % str(zaten).lower())
          if zaten:
              print("::notice::%s bulteni otomatik hat tarafindan zaten gonderilmis, posta atlandi" % sys.argv[1], file=sys.stderr)
          PY

      - name: ONAY guncel kosuya ait mi
        if: steps.guard.outputs.atla != 'true'
        run: |
          test -f out/ONAY || { echo "out/ONAY yok"; exit 1; }
          test -s out/email.html || { echo "out/email.html bos"; exit 1; }
          ONAY_DONEM=$(head -1 out/ONAY | tr -d '[:space:]')
          KOSU_DONEM=$(python - <<'PY'
          import glob, json
          f = sorted(glob.glob("out/hafta_*.json"))[-1]
          print(json.load(open(f, encoding="utf-8"))["period"])
          PY
          )
          echo "ONAY: $ONAY_DONEM | kosu: $KOSU_DONEM"
          if [ "$ONAY_DONEM" != "$KOSU_DONEM" ]; then
            echo "ONAY donemi kosu donemiyle ayni degil - posta GONDERILMEDI"
            exit 1
          fi

      # SIRLAR EKSIKSE SESSIZCE ATLANMAZ (2026-08-31). Onceki surumde posta
      # adimi "if: env.MAIL_USER != ''" tasiyordu: sir tanimli degilse adim
      # ATLANIYOR, is akisi YESIL bitiyor ve "posta gonderildi" ozeti yine
      # yaziliyordu. Gonderilmeyen bulten, gonderilmis gibi gorunuyordu.
      - name: Sirlar tanimli mi
        if: steps.guard.outputs.atla != 'true'
        run: |
          eksik=""
          [ -n "${{ secrets.MAIL_USER }}" ] || eksik="$eksik MAIL_USER"
          [ -n "${{ secrets.MAIL_PASS }}" ] || eksik="$eksik MAIL_PASS"
          [ -n "${{ secrets.MAIL_TO }}"   ] || eksik="$eksik MAIL_TO"
          if [ -n "$eksik" ]; then
            echo "POSTA GONDERILEMEZ - tanimli olmayan sir(lar):$eksik"
            exit 1
          fi
          echo "sirlar tanimli"

      - name: E-posta gonder
        id: posta
        if: steps.guard.outputs.atla != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "Soguk Haddehane ve Nihai Hatlarda Sektor & Teknoloji Takibi — Haftalik Bulten"
          to: ${{ secrets.MAIL_TO }}
          from: SogukRadar Bulten <${{ secrets.MAIL_USER }}>
          html_body: file://out/email.html

      # KANIT (2026-08-31). Gonderme adimi hicbir sey basmiyordu; "success"
      # disinda elimizde delil yoktu ve haftalarca postanin gidip gitmedigi
      # anlasilamadi. Ozet artik NE gonderildigini yaziyor.
      - name: Ozet
        if: steps.guard.outputs.atla != 'true'
        run: |
          {
            echo "### SogukRadar posta"
            echo ""
            echo "- donem: $(head -1 out/ONAY)"
            echo "- gonderme adimi: ${{ steps.posta.outcome }}"
            echo "- alici sayisi: $(echo '${{ secrets.MAIL_TO }}' | tr ',' '\n' | grep -c .)"
            echo "- govde: out/email.html ($(wc -c < out/email.html) bayt, $(grep -c '<tr' out/email.html || true) satir etiketi)"
            echo ""
            echo "Konu: Soguk Haddehane ve Nihai Hatlarda Sektor & Teknoloji Takibi"
          } >> $GITHUB_STEP_SUMMARY
          test "${{ steps.posta.outcome }}" = "success" || exit 1
