name: SogukRadar haftalik

on:
  schedule:
    # Pazartesi 04:05 UTC = 07:05 TSI. Actions kuyrugu gecikebilir, sorun degil.
    - cron: "37 4 * * 1"
  # PUSH TETIKLEYICISI KALDIRILDI (2026-08-17 karari). Her kod push'u tam
  # tarama baslatiyordu; tarama out/ dosyalarini eziyor, ayrica program disi
  # posta zincirine yol aciyordu (2026-W34'te tek gunde dort tarama kostu ve
  # bir kosunun ciktisi catismada kayboldu). Tarama YALNIZ haftada bir
  # calisir; kod degisikligini denemek icin workflow_dispatch kullanilir.
  workflow_dispatch:
    inputs:
      today:
        description: "Kosuyu bu tarihe gore yap (YYYY-MM-DD, bos = bugun)"
        required: false
      check_sources:
        description: "Once kaynak saglik taramasi yap (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sogukradar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 90 DAKIKA (2026-08-31). 45 dakikaydi ve BUGUNKU haftalik kosu tam o
    # sinirda iptal oldu: 04:39:12'de basladi, 05:24:22'de kesildi, hicbir
    # cikti uretmedi ve is akisi "cancelled" olarak sessizce bitti. Bulten
    # bu yuzden gitmedi. Kaynak sayisi 133'ten 169'a cikarken, Google News
    # penceresi 7 gunden 30 gune genislerken ve sitemap zinciri eklenirken
    # sure de buyudu; sinir buyumeye ayak uyduramadi. Gunluk tarama ayni
    # islemi 90 dakika siniriyla ~19 dakikada bitiriyor.
    timeout-minutes: 90
    env:
      MAIL_USER: ${{ secrets.MAIL_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bagimlilik YOK - sadece standart kutuphane. pip adimi bilerek eklenmedi.

      - name: Birim testleri (kirmizi ise kosu baslamaz)
        run: |
          python -m radar selftest
          python tests/e2e_offline.py

      - name: Kaynak saglik taramasi
        # push tetikleyicisi kalktigi icin 'event_name == push' kolu da atildi.
        if: ${{ github.event.inputs.check_sources == 'true' }}
        run: python -m radar check || true

      - name: Haftalik kosu
        env:
          # 21 GUN = UC HAFTA (2026-08-31, kullanici karari).
          #
          # Once 7, sonra 15 gundu. Olcum: 6,5 aylik gecmiste kapsam ici
          # haber haftada 0,83 ve haftalarin %40'i SIFIR; kaynak 403
          # verdiginde ya da tarih gec cozuldugunde dar pencerede haber BIR
          # DAHA yakalanmiyordu. Uc hafta ayni habere UC hafta sans verir.
          #
          # Tekrar riski YOK: ayni haber state["seen"], olay parmak izi ve
          # baslik benzerligi olmak uzere UC bacakli savunmadan geciyor;
          # pencerenin genisligi tekrar uretmez, yalnizca KACIRMAYI azaltir.
          RADAR_WINDOW_DAYS: "21"
          RADAR_MAX_ARTICLES: "220"
          # 0.8 -> 0.5: gunluk tarama bu degerle 169 kaynagi ~19 dakikada
          # bitiriyor; haftalik kosunun 0.8 ile 45 dakikayi asmasinin
          # sebeplerinden biri buydu. Bekleme host BASINA uygulaniyor ve
          # 90 Google News adresi ayni host'ta sirali bekliyor.
          RADAR_PAUSE: "0.5"
        run: |
          if [ -n "${{ github.event.inputs.today }}" ]; then
            python -m radar run --commit-state --today "${{ github.event.inputs.today }}"
          else
            python -m radar run --commit-state
          fi

      # CAPRAZ KONTROL (2026-08-17). Editorun elle yaptigi "sitemap'leri ac,
      # listede olmayan kapsam ici haber var mi" isi. Editorun kendi kum
      # havuzunda YAPILAMIYOR (o oturumun ag cikisi haber alan adlarina
      # kapali, 403); burada kosucunun interneti aciktir.
      #
      # Haftalik kosudan SONRA calisir - karsilastirdigi liste bu kosunun
      # ciktisidir. Bir sitemap coktugunde haftalik kosu bosa gitmesin diye
      # adim hata verse bile is akisi devam eder; durum kacanlar.json'a
      # "erisilemedi" olarak yazilir.
      - name: Capraz kontrol (sitemap - listede olmayanlar)
        continue-on-error: true
        env:
          RADAR_WINDOW_DAYS: "21"
          RADAR_CAPRAZ_MAX: "40"
        run: |
          if [ -n "${{ github.event.inputs.today }}" ]; then
            python -m radar capraz --today "${{ github.event.inputs.today }}"
          else
            python -m radar capraz
          fi

      - name: Ozeti is akisina yaz
        run: |
          echo '### SogukRadar' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json, os
          f = sorted(glob.glob("out/hafta_*.json"))[-1]
          d = json.load(open(f, encoding="utf-8"))
          ozet = {"donem": d["period"], "satir": len(d["rows"]),
                  "istatistik": d["stats"],
                  "erisilemeyen": [u[0] for u in d.get("unreachable", [])]}
          if os.path.exists("out/kacanlar.json"):
              k = json.load(open("out/kacanlar.json", encoding="utf-8"))
              ozet["capraz"] = {
                  "sitemap_adayi": k.get("sitemap_adayi", 0),
                  "kapiyi_gecen": k.get("kapiyi_gecen", 0),
                  "kacan": k["adet"],
                  "basliklar": [r["baslik"][:80] for r in k["kacanlar"]],
                  "acildi_elendi": ["%s | %s" % (r["sebep"], r["baslik"][:60])
                                    for r in k.get("acildi_elendi", [])],
                  "dogrulanamayan": ["%s | %s" % (r["sebep"], r["baslik"][:60])
                                     for r in k.get("dogrulanamayan", [])],
                  "kaynak_sorunu": [v["publisher"] for v in k["kaynaklar"].values()
                                    if v["durum"] != "ok"]}
          print(json.dumps(ozet, ensure_ascii=False, indent=1))
          PY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # POSTA BU IS AKISINDAN CIKARILDI (2026-08-17 karari).
      #
      # Neden: posta 07:05'te, editor daha rapora BAKMADAN gidiyordu. Bozuk
      # bir satir (ornek 2026-W34: sicak haddeleme hatti "Hat" rozetiyle)
      # duzeltilemeden aliciya ulasiyordu; editorun katkisi ancak bir sonraki
      # haftaya yariyordu. Artik sira dogru:
      #
      #   1) bu is akisi veriyi uretir ve repoya isler (POSTA YOK)
      #   2) editor out/ dosyalarini okur, duzeltir, zenginlestirir,
      #      finalize eder ve out/ONAY dosyasini yazip push eder
      #   3) gonder.yml ONAY push'unu gorur ve postayi o an gonderir
      #
      # Editor onaylamazsa posta GITMEZ. Bu bilincli bir tercih: bozuk
      # bulten gondermektense gondermemek yegdir (testlerin kapi olmasiyla
      # ayni mantik).

      - uses: actions/upload-artifact@v4
        with:
          name: sogukradar-hafta
          path: |
            out/hafta_*.json
            out/hafta_*_taslak.html
            out/hafta_*.csv
            out/needs_ai.json
            out/reddedilenler.json
            out/kacanlar.json
            out/email_body.md
          retention-days: 90

      - name: Ciktilari repoya isle
        run: |
          git config user.name  "sogukradar-bot"
          git config user.email "bot@users.noreply.github.com"
          # out/ ve state/ her kosuda TAM yeniden uretilir; iki kosu ust uste
          # bindiginde eski surumle "birlestirmek" anlamsizdir - dogru olan BU
          # kosunun ciktisidir.
          #
          # ONCEKI SURUM VERI KAYBEDIYORDU (2026-08-17'de olculdu). Catismada
          #   git rebase --abort; git reset --hard origin/main; break
          # calisiyordu: reset --hard kosunun KENDI commit'ini atiyor, break de
          # push etmeden dongudan cikiyordu. Adim yine 0 donuyor, yani is akisi
          # "basarili" gorunurken ciktisi sessizce yok oluyordu - capraz
          # kontrolun ilk kosusunda out/kacanlar.json boyle kayboldu.
          #
          # Cozum: rebase yok. Index origin/main'e alinir (calisma agacina
          # DOKUNULMAZ), uretilen dosyalar yeniden sahnelenir. Catisma imkansiz,
          # kod dosyalari geri alinmaz cunku yalniz out/ ve state/ sahnelenir.
          for i in 1 2 3; do
            git fetch origin main
            git reset --quiet origin/main
            git add out state
            if git diff --staged --quiet; then
              echo "degisiklik yok, commit gerekmedi"
              break
            fi
            git commit -q -m "haftalik kosu $(date -u +%Y-W%V) [skip ci]"
            git push && break
            echo "push reddedildi, yeniden deneniyor ($i/3)"
            sleep 5
          done
