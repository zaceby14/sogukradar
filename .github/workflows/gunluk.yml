name: SogukRadar gunluk tarama

# GUNLUK TARAMA (2026-08-27). Haftalik kosu tek basina yetmiyordu: yayincilar
# haberi gec indeksliyor, kaynaklar gun icinde 403/timeout verip ertesi gun
# aciliyor ve 15 gunluk pencere kapaninca haber BIR DAHA yakalanmiyordu.
# Olcum: son haftalik kosuda elenen 30 kapsam ici satirin 26'si sirf pencere
# disiydi.
#
# Bu is akisi POSTA GONDERMEZ ve posta govdesine DOKUNMAZ (--sadece-tarama).
# Tek isi havuzu beslemek: rezerv + teknoloji adaylari. Haftalik bulten bu
# havuzdan doluyor, boylece satir sayisi KAPI GEVSETILMEDEN yukseliyor.
on:
  schedule:
    - cron: "17 3 * * *"        # her gun 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # bulten gitmediyse otomatik.yml'yi tetikleyebilmek icin

concurrency:
  group: sogukradar             # haftalik kosuyla ayni grup - cakismaz
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Kirmizi test TARAMAYI DURDURMAZ (2026-11-09): 8 Kasim'da tarihe bagli bir
      # test hatasi gunluk taramayi durdurdu. Tarama havuzu besler, posta atmaz;
      # kirmizi test sahibine uyari postasiyla bildirilir.
      - name: Birim testleri
        id: test
        continue-on-error: true
        run: |
          python -m radar selftest
          python tests/e2e_offline.py

      - name: Geri bildirimleri oku
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python -m radar geri-bildirim

      - name: Gunluk tarama
        env:
          RADAR_WINDOW_DAYS: "21"
          RADAR_MAX_ARTICLES: "420"
          RADAR_PAUSE: "0.5"
        run: python -m radar run --commit-state --sadece-tarama

      - name: Capraz kontrol
        continue-on-error: true
        env:
          RADAR_WINDOW_DAYS: "21"
          RADAR_CAPRAZ_MAX: "40"
        run: python -m radar capraz

      - name: Ozeti is akisina yaz
        run: |
          echo '### SogukRadar gunluk tarama' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json
          f = sorted(glob.glob("out/hafta_*.json"))[-1]
          d = json.load(open(f, encoding="utf-8"))
          st = json.load(open("state/state.json", encoding="utf-8"))
          print(json.dumps({"donem": d["period"], "satir": len(d["rows"]),
                            "istatistik": d["stats"],
                            "rezerv_havuz": len(st.get("rezerv", [])),
                            "teknoloji_adayi": len(st.get("tech_rezerv", [])),
                            "erisilemeyen": [u[0] for u in d.get("unreachable", [])]},
                           ensure_ascii=False, indent=1))
          PY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # SESSIZLIK BEKCISI (2026-11-02): bulten 14 gunden fazladir gitmediyse
      # (Carsamba gunleri) MAIL_USER'a uyari yollar. 5 haftalik sessizlik
      # kimse fark etmeden gecmisti.
      - name: Sessizlik bekcisi
        id: nobet
        continue-on-error: true
        run: python -m radar nobet

      - name: Sessizlik uyarisi
        if: steps.nobet.outputs.uyari == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "SogukRadar UYARI — bulten uzun suredir gitmedi"
          to: ${{ secrets.MAIL_USER }}
          from: SogukRadar Bulten <${{ secrets.MAIL_USER }}>
          body: file://out/uyari.txt

      - name: Teslim kontrolu (reddedilen posta var mi)
        id: teslim
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python -m radar teslim-kontrol --gun 2

      - name: Teslim uyarisi
        if: steps.teslim.outputs.bounce == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "SogukRadar UYARI — bir alici bulteni reddetti"
          to: ${{ secrets.MAIL_USER }}
          from: SogukRadar Bulten <${{ secrets.MAIL_USER }}>
          body: file://out/uyari.txt

      - name: Kirmizi test uyarisi
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "SogukRadar UYARI — birim testleri kirmizi (tarama devam etti)"
          to: ${{ secrets.MAIL_USER }}
          from: SogukRadar Bulten <${{ secrets.MAIL_USER }}>
          body: "Gunluk taramada birim testleri basarisiz oldu. Tarama ve bulten durdurulmadi; kod duzeltilmeli. Ayrinti: Actions > SogukRadar gunluk tarama."

      # YEDEK GONDERIM YOLU (2026-11-09): GitHub zamanlayicisi bulteni saatlerce
      # geciktirdi/atladi. Pazartesi-Carsamba arasi bu ISO haftasinin bulteni
      # gitmediyse gunluk tarama bulten is akisini KENDISI baslatir. Ayni hafta
      # ikinci posta gitmez (otomatik.yml 'bu hafta gonderildi' kontrolu yapar).
      - name: Bu hafta bulten gitti mi - gitmediyse baslat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KARAR=$(python3 - <<'PY'
          import datetime as dt, json
          bugun = dt.datetime.utcnow() + dt.timedelta(hours=3)          # TSI
          y, w, g = bugun.isocalendar()
          per = "%04d-W%02d" % (y, w)
          st = json.load(open("state/state.json", encoding="utf-8"))
          gitti = per in (st.get("gonderilen_donemler") or [])
          # Pazartesi 10:00 TSI'den sonra ya da Sali/Carsamba
          vakit = (g == 1 and bugun.hour >= 10) or g in (2, 3)
          print("baslat" if (vakit and not gitti) else "gerek-yok:%s gitti=%s" % (per, gitti))
          PY
          )
          echo "karar: $KARAR"
          if [ "$KARAR" = "baslat" ]; then
            gh workflow run otomatik.yml -R "$GITHUB_REPOSITORY" -f deneme=false
            echo "bulten is akisi baslatildi" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Ciktilari repoya isle
        if: always()
        run: |
          rm -f out/uyari.txt
          git config user.name  "sogukradar-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --quiet origin/main
            git add out state
            if git diff --staged --quiet; then
              echo "degisiklik yok"
              break
            fi
            git commit -q -m "gunluk tarama $(date -u +%Y-%m-%d) [skip ci]"
            git push && break
            echo "push reddedildi, yeniden ($i/3)"
            sleep 5
          done
